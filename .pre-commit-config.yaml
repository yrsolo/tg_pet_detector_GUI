repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ./.venv/Scripts/python.exe -m ruff check . --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: ./.venv/Scripts/python.exe -m ruff format .
        language: system
        types: [python]
        
  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest (smoke)
        entry: ./.venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false